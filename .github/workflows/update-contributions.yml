name: Update contribution graph

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_contributions.py
      - .github/workflows/update-contributions.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate contribution calendar
        run: python scripts/update_contributions.py
      - name: Commit updated graph
        run: |
          if git diff --quiet -- assets/github-contributions.svg; then
            echo "Contribution graph is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contributions.svg
          git commit -m "Update GitHub contribution graph"
          git push
